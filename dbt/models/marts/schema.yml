version: 2

models:
  - name: fct_price
    description: Price data from daily AEMO dispatch files
    columns:
      - name: REGIONID
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        tests:
          - not_null
      - name: file
        tests:
          - not_null

  - name: fct_scada
    description: SCADA data from daily AEMO dispatch files
    columns:
      - name: DUID
        tests:
          - not_null
          - relationships:
              to: ref('dim_duid')
              field: DUID
              config:
                severity: warn
      - name: SETTLEMENTDATE
        tests:
          - not_null
      - name: file
        tests:
          - not_null

  - name: fct_price_today
    description: Intraday price data from AEMO dispatch files
    columns:
      - name: REGIONID
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        tests:
          - not_null
      - name: file
        tests:
          - not_null

  - name: fct_scada_today
    description: Intraday SCADA data from AEMO dispatch files
    columns:
      - name: DUID
        tests:
          - not_null
      - name: SETTLEMENTDATE
        tests:
          - not_null
      - name: file
        tests:
          - not_null

  - name: agg_region_daily
    description: >
      Generation rolled up to region x date. The grain the ontology graph binds to;
      fct_summary itself is far too large and too fine to sit in a graph.
    columns:
      - name: RegionDayKey
        description: Region|date — string key, because ontology entity keys cannot be dates
        tests:
          - unique
          - not_null
      - name: Region
        tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: RegionID
      - name: IntervalCount
        description: 288 on a complete day; lower means a partial day or a gap in the archive
        tests:
          - not_null

  - name: fct_summary
    description: Combined SCADA and price summary
    columns:
      - name: date
        tests:
          - not_null:
              config:
                tags: [heavy]
      - name: DUID
        tests:
          - not_null:
              config:
                tags: [heavy]
          - relationships:
              to: ref('dim_duid')
              field: DUID
              config:
                tags: [heavy]
      - name: mw
        tests:
          - not_null:
              config:
                tags: [heavy]
      - name: price
        tests:
          - not_null:
              config:
                tags: [heavy]
