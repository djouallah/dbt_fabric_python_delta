name: 🔍 XMLA benchmark semantic models

# Manual only. Runs a suite of heavy DAX queries against every semantic model in
# fabric_items/ over the XMLA endpoint (ADOMD.NET) and TIMES them — to see whether the
# _vorder model (Fabric V-Order fact) is faster in Direct Lake than the delta-rs base. Same data, so
# numbers are identical; only speed differs. Uses XMLA, NOT the throttled /executeQueries
# REST endpoint. Runs on windows-latest where ADOMD.NET loads cleanly.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "deploy_config.yml env whose workspace to query"
        type: string
        default: main
      runs:
        description: "repetitions per query per model (best/min is reported)"
        type: string
        default: "3"
      cold:
        description: "measure cold by dehydrating (clearValues+full) before each query"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  benchmark:
    name: 🔍 Benchmark
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps
        run: pip install pythonnet pyyaml duckrun

      - name: 🧩 Install ADOMD.NET client (NuGet)
        shell: pwsh
        run: |
          # NetCore build so it loads under pythonnet's coreclr runtime. No -Version => latest stable.
          nuget install Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 -OutputDirectory nuget -NonInteractive
          "ADOMD_DIR=$PWD\nuget" >> $env:GITHUB_ENV

      - name: 🔐 Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: 📊 Table stats (duckrun) — fct_summary vs fct_summary_vorder
        # Nice-to-have — never let a stats hiccup block the benchmark below.
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = "Stop"
          # Resolve the lakehouse OneLake Tables path: ws id from deploy_config.yml, lakehouse id from the Fabric API.
          $meta = python -c "import yaml, json; c = yaml.safe_load(open('deploy_config.yml')); e = {**c.get('defaults', {}), **c['${{ inputs.env }}']}; print(json.dumps({'ws': e['ws'], 'lh': e['lakehouse_name']}))" | ConvertFrom-Json
          $lhs = az rest --method get --resource "https://api.fabric.microsoft.com" --url "https://api.fabric.microsoft.com/v1/workspaces/$($meta.ws)/lakehouses" | ConvertFrom-Json
          $lhId = ($lhs.value | Where-Object { $_.displayName -eq $meta.lh }).id
          if (-not $lhId) { throw "Could not find lakehouse '$($meta.lh)' in workspace $($meta.ws)" }
          $env:ONELAKE_TABLES_PATH = "abfss://$($meta.ws)@onelake.dfs.fabric.microsoft.com/$lhId/Tables"
          # Mint a OneLake storage token and pass it explicitly — duckrun's token auto-discovery
          # isn't wired on a bare runner, so hand it the bearer token via storage_options.
          $env:ONELAKE_TOKEN = az account get-access-token --resource "https://storage.azure.com/" --query accessToken -o tsv
          if (-not $env:ONELAKE_TOKEN) { throw "failed to mint OneLake storage token" }
          echo "::add-mask::$env:ONELAKE_TOKEN"
          python table_stats.py

      - name: 🔍 Benchmark both models over XMLA
        shell: pwsh
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_COLD: ${{ inputs.cold }}
        run: |
          $ErrorActionPreference = "Stop"
          # Resolve the target workspace: id from deploy_config.yml, then name from the Power BI API.
          $wsId = python -c "import yaml; c = yaml.safe_load(open('deploy_config.yml')); print({**c.get('defaults', {}), **c['${{ inputs.env }}']}['ws'])"
          $groups = az rest --method get --resource "https://analysis.windows.net/powerbi/api" --url "https://api.powerbi.com/v1.0/myorg/groups?`$filter=id eq '$wsId'" | ConvertFrom-Json
          $wsName = $groups.value[0].name
          if (-not $wsName) { throw "Could not resolve workspace name for id $wsId (are you a member?)" }
          $token = az account get-access-token --resource "https://analysis.windows.net/powerbi/api" --query accessToken -o tsv
          echo "::add-mask::$token"
          $env:PBI_WORKSPACE = $wsName
          $env:PBI_TOKEN = $token
          python xmla_compare.py
