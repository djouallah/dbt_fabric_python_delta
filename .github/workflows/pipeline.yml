name: 🚀 Deploy to Fabric

on:
  # Manual only — no auto-trigger on push. Run from the Actions tab / gh workflow run.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the Fabric items? (the lakehouse is always provisioned in Phase 1) none = skip; no_model = everything except the semantic model; full = everything"
        type: choice
        options: [none, no_model, full]
        default: none
      runner:
        description: "Where dbt runs. remote = a throwaway Fabric notebook, data-local to OneLake (default); local = on the GitHub runner, pulling every byte across the internet"
        type: choice
        options: [remote, local]
        default: remote
      cores:
        description: "vCores for the remote notebook (Fabric sizes 4/8/16/32/64). Ignored when runner=local"
        type: choice
        options: ["4", "8", "16", "32"]
        default: "8"
      workspace_id:
        description: "Target Fabric workspace GUID"
        type: string
        default: "450bf196-431f-463f-9316-2d1ce1da98db"
      lakehouse:
        description: "Transform lakehouse (dbt Delta tables + Files/dbt)"
        type: string
        default: "aemo"
      lakehouse_landing:
        description: "Landing lakehouse (raw AEMO archive; created empty if missing — a fresh one bootstraps from scratch)"
        type: string
        default: "aemo_landing"
      folder:
        description: "Workspace folder every deployed item lands in"
        type: string
        default: "FabricIQ"

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pages: write

env:
  # DuckDB's azure extension reads OneLake over a curl transport (its default transport
  # fails the OneLake TLS handshake) and curl needs the runner's CA bundle.
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  # The only Azure inputs: the OIDC federated identity. duckrun mints every token it needs
  # (OneLake storage, Fabric control plane, Power BI) by exchanging a fresh GitHub OIDC
  # assertion — no azure/login, no token step. Needs `id-token: write` (set above).
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # The deploy target, from workflow inputs — a plain `gh workflow run` gets the defaults.
  # deploy.py and every helper script read these SAME env vars with the same defaults, so
  # the target is defined exactly twice (here and in each script's fallback) and can be
  # overridden everywhere at once from the dispatch form. FOLDER matters in Phase 1 too:
  # duckrun only places an item in a folder when it CREATES it.
  # Two lakehouses, both in the target workspace: LH_NAME holds every Delta table dbt
  # builds plus the dbt project under Files/dbt; LH_LANDING holds the raw AEMO archive
  # under Files/ and is never written by dbt's Tables output. A missing landing is CREATED
  # empty and bootstraps from scratch, download_limit files per source per run.
  WS_ID: ${{ github.event.inputs.workspace_id || '450bf196-431f-463f-9316-2d1ce1da98db' }}
  LH_NAME: ${{ github.event.inputs.lakehouse || 'aemo' }}
  LH_LANDING: ${{ github.event.inputs.lakehouse_landing || 'aemo_landing' }}
  FOLDER: ${{ github.event.inputs.folder || 'FabricIQ' }}
  # CI's own dbt run only — deliberately smaller than the limit deploy.py injects into the
  # variable library for the in-Fabric notebook run. Caps NEW downloads per run; there is no
  # process limit any more (every model rebuilds from the full archive).
  CI_DOWNLOAD_LIMIT: "6"
  # Where dbt runs, and how big the remote notebook is. Defaults matter: a plain
  # `gh workflow run` with no inputs gets the remote runner at 8 vCores.
  DBT_RUNNER: ${{ github.event.inputs.runner || 'remote' }}
  DBT_CORES: ${{ github.event.inputs.cores || '8' }}

jobs:
  pipeline:
    name: 🎯 Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        # pyyaml (ontology.py reads ontology.yaml) already arrives via duckrun -> dbt-core,
        # but naming it keeps a transitive dependency from becoming load-bearing.
        run: pip install duckrun pyyaml

      - name: 🏗️  Phase 1 — Provision Lakehouse
        run: |
          T0=$(date +%s)
          python - <<EOF >> "$GITHUB_ENV"
          import os, duckrun
          ws_id, lh_name = os.environ["WS_ID"], os.environ["LH_NAME"]
          landing = os.environ["LH_LANDING"]
          ws = duckrun.workspace(ws_id)
          names = [l["displayName"] for l in ws.list_lakehouses()]
          existed = lh_name in names
          lh_id = ws.create_lakehouse(lh_name, folder=os.environ["FOLDER"])   # idempotent, schema-enabled
          # The landing lakehouse is created too (idempotent): a fresh workspace starts with
          # an EMPTY archive and stg_csv_archive_log bootstraps it from scratch, downloading
          # download_limit files per source per run. Any pre-existing archive elsewhere is a
          # different deployment target and stays untouched.
          landing_id = ws.create_lakehouse(landing, folder=os.environ["FOLDER"])
          # BOTH paths are full abfss URLs. duckrun would expand the OneLake shorthand
          # `<workspace>/<item>.Lakehouse` for the Tables root, but RemoteRunner rejects it —
          # it needs the URL to locate the workspace and lakehouse to run the notebook against.
          # FILES_PATH was always a full URL: stg_csv_archive_log.py and the read_csv macros
          # paste it straight into read_csv/read_parquet, which never see the expander.
          #
          # THE TWO POINT AT DIFFERENT LAKEHOUSES. Tables -> the new lakehouse dbt builds into;
          # Files -> the landing lakehouse holding the raw archive. dbt keeps ONE root_path, so
          # every ref() still resolves inside one lakehouse and nothing crosses.
          print(f"ONELAKE_TABLES_PATH=abfss://{ws_id}@onelake.dfs.fabric.microsoft.com/{lh_id}/Tables")
          print(f"FILES_PATH=abfss://{ws_id}@onelake.dfs.fabric.microsoft.com/{landing_id}/Files")
          print(f"WS_NAME={ws.display_name}")
          print(f"LH_ID={lh_id}")
          print(f"LH_LANDING_ID={landing_id}")
          print(f"LH_ACTION={'already existed' if existed else 'just created'}")
          print(f"download_limit={os.environ['CI_DOWNLOAD_LIMIT']}")
          EOF
          echo "T_LAKEHOUSE=$(($(date +%s) - T0))" >> "$GITHUB_ENV"

      - name: 🔨 Phase 2 — dbt run
        # ONE run. Every model is a table now, so the DAG order is all the sequencing there is
        # — no check_new_daily probe, no --full-refresh branch, no per-model excludes.
        # stg_csv_archive_log downloads new CSVs as a side effect and everything downstream
        # rebuilds from the whole archive. run_dbt.py picks the runner and writes the phase
        # timing plus the run_results.json the dashboard reads.
        run: python run_dbt.py run

      - name: ✅ Phase 3 — dbt test
        run: python run_dbt.py test

      - name: 🔁 Phase 3.5 — Refresh ontology graph
        # Data changes do NOT auto-refresh the graph model the Operations Agent monitors —
        # only schema changes do. The script is tolerant by design (no graph deployed, or a
        # refresh already in flight, both exit 0) so it can never fail a data load.
        run: python refresh_graph.py

      - name: 📚 Phase 4 — dbt docs generate
        # Always local: docs is a catalog query, not a build, and Pages publishes the local
        # target/ directory that only a local run produces.
        run: python run_dbt.py docs

      - name: 🚀 Phase 5 — Deploy Fabric items (optional)
        run: |
          T0=$(date +%s)
          # The lakehouse is always provisioned in Phase 1 — deploying the Fabric items is
          # optional and OFF by default. Orchestration is GitHub Actions; the Fabric
          # notebook/pipeline are just a demo. Three scopes: "none" (default, also what a
          # plain push gets) skips the item deploy; "full" deploys everything —
          # notebook/VL/pipeline, the semantic model, and the ontology + data agent — via
          # `deploy.py`; "no_model" is "full" minus the semantic model, for iterating on the
          # ontology without paying for the Direct Lake reframe. The already-deployed model
          # is left in place under no_model, just not updated.
          DEPLOY="${{ github.event.inputs.deploy }}"
          DEPLOY="${DEPLOY:-none}"
          echo "DEPLOY_SCOPE=$DEPLOY" >> "$GITHUB_ENV"
          if [ "$DEPLOY" = "none" ]; then
            echo "::notice::Deploy scope 'none' — skipping Fabric item deploy."
            echo "DEPLOY_SKIPPED=true" >> "$GITHUB_ENV"
          else
            echo "Deploy scope: $DEPLOY"
            [ "$DEPLOY" = "no_model" ] && export DEPLOY_SEMANTIC_MODEL=false
            python deploy.py
            echo "DEPLOY_SKIPPED=false" >> "$GITHUB_ENV"
          fi
          echo "T_DEPLOY=$(($(date +%s) - T0))" >> "$GITHUB_ENV"

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

      - name: 📝 Build dashboard summary
        if: always()
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from collections import Counter

          def fmt(s):
              s = int(s or 0)
              return f"{s}s" if s < 60 else f"{s//60}m {s%60:02d}s"

          def env(k, default=''):
              return os.environ.get(k, default) or default

          phases = [
              ('🏗️', 'Provision Lakehouse', env('T_LAKEHOUSE', '0')),
              ('🔨', 'dbt run',             env('T_DBT_RUN',   '0')),
              ('✅', 'dbt test',            env('T_DBT_TEST',  '0')),
              ('📚', 'dbt docs',            env('T_DBT_DOCS',  '0')),
              ('🚀', 'Deploy Fabric',       env('T_DEPLOY',    '0')),
          ]
          total = sum(int(p[2] or 0) for p in phases)

          # Merge run + retry snapshots: dbt retry overwrites run_results.json
          # with only the reran nodes, so later snapshots override earlier ones
          # per unique_id to recover the final status of every model. Keep only
          # model nodes (drop on-run hooks/operations) so the count matches docs.
          def load_results(path):
              try:
                  return json.load(open(path))['results']
              except FileNotFoundError:
                  return []

          merged = {}
          for p in ('/tmp/rr_0.json', '/tmp/rr_1.json', '/tmp/rr_2.json'):
              for r in load_results(p):
                  if r['unique_id'].startswith('model.'):
                      merged[r['unique_id']] = r
          rs = list(merged.values())
          rstat = Counter(x['status'] for x in rs)
          rslow = sorted(rs, key=lambda x: -x.get('execution_time', 0))[:3]

          try:
              ts = json.load(open('/tmp/test_results.json'))['results']
              tstat = Counter(x['status'] for x in ts)
              ttotal = len(ts)
          except FileNotFoundError:
              tstat, ttotal = Counter(), 0

          try:
              m = json.load(open('dbt/target/manifest.json'))
              by_type = Counter(n.get('resource_type') for n in m.get('nodes', {}).values())
              n_sources = len(m.get('sources', {}))
              n_macros = len(m.get('macros', {}))
          except FileNotFoundError:
              by_type, n_sources, n_macros = Counter(), 0, 0

          # The semantic model lives outside fabric_items/ so it can be skipped — count it
          # only when the scope actually deployed it, else a no_model run would over-report.
          items = []
          if env('DEPLOY_SKIPPED') != 'true':
              dirs = ['fabric_items'] + (['semantic_model'] if env('DEPLOY_SCOPE') == 'full' else [])
              for d in dirs:
                  try:
                      for f in sorted(os.listdir(d)):
                          if '.' in f:
                              name, typ = f.rsplit('.', 1)
                              items.append((typ, name))
                  except FileNotFoundError:
                      pass

          ws        = env('WS_NAME', '?')
          lh        = env('LH_NAME', '?')
          ws_id     = env('WS_ID')
          lh_id     = env('LH_ID')
          lh_action = env('LH_ACTION', '?')
          sha       = env('GITHUB_SHA')[:7]
          branch    = env('GITHUB_REF_NAME', '?')
          actor     = env('GITHUB_ACTOR', '?')
          page_url  = env('PAGE_URL')
          repo      = env('GITHUB_REPOSITORY')
          server    = env('GITHUB_SERVER_URL', 'https://github.com')
          run_id    = env('GITHUB_RUN_ID')

          # ===== Header =====
          print("# 🎯 Pipeline Summary")
          print()
          print(f"![pipeline](https://img.shields.io/badge/pipeline-success-brightgreen?style=for-the-badge&logo=githubactions)", end=' ')
          print(f"![workspace](https://img.shields.io/badge/workspace-{ws}-0078d4?style=for-the-badge&logo=microsoft)", end=' ')
          print(f"![branch](https://img.shields.io/badge/branch-{branch}-7719aa?style=for-the-badge)", end=' ')
          print(f"![sha](https://img.shields.io/badge/sha-{sha}-grey?style=for-the-badge&logo=github)", end=' ')
          print(f"![duration](https://img.shields.io/badge/total-{fmt(total).replace(' ', '_')}-blue?style=for-the-badge)")
          print()

          # ===== 4-card layout: Timings | Fabric on top, dbt full-width below =====
          print("<table>")

          # Row 1: Timings | Fabric (Lakehouse details + deployed items)
          print('<tr><td width="50%" valign="top">\n')
          print("### ⏱️ Phase Timings\n")
          print("| Phase | Duration |")
          print("| --- | ---: |")
          for emoji, name, secs in phases:
              print(f"| {emoji} {name} | {fmt(secs)} |")
          print(f"| **Total** | **{fmt(total)}** |")
          print('\n</td><td width="50%" valign="top">\n')
          print("### 🚀 Fabric\n")
          print("| Item | Name |")
          print("| :---: | --- |")
          print(f"| 🏢 Workspace | `{ws}` |")
          print(f"| 🏠 Lakehouse | `{lh}` _({lh_action})_ |")
          print(f"| 📦 Landing | `{env('LH_LANDING', '?')}` _(raw archive, read-only)_ |")
          print(f"| ⚙️ dbt runner | {env('DBT_RUNNER_USED', env('DBT_RUNNER', '?'))} |")
          if env('DEPLOY_SKIPPED') == 'true':
              print("\n_Deploy skipped — run with `deploy: full` to deploy the Fabric items_")
          else:
              emojis = {
                  'Lakehouse': '🏠', 'Notebook': '📓', 'SemanticModel': '📊',
                  'DataPipeline': '🔄', 'VariableLibrary': '📚',
                  'Warehouse': '🏭', 'Report': '📈',
              }
              for typ, name in items:
                  print(f"| {emojis.get(typ, '📦')} {typ} | `{name}` |")
              if env('DEPLOY_SCOPE') == 'no_model':
                  print("\n_📊 Semantic model skipped (`deploy: no_model`) — the existing model is untouched_")
          print('\n</td></tr>')

          # Row 2: dbt (run · test · docs) — full width, three sub-columns
          ok = rstat.get('success', 0); err = rstat.get('error', 0); skip = rstat.get('skipped', 0)
          tp = tstat.get('pass', 0); tf = tstat.get('fail', 0); tw = tstat.get('warn', 0); te = tstat.get('error', 0)
          icons = {'model': '🧱', 'test': '✅', 'seed': '🌱', 'snapshot': '📸', 'operation': '⚙️'}
          print('<tr><td colspan="2" valign="top">\n')
          print("### 🔨 dbt\n")
          print('<table><tr><td valign="top">\n')
          # run
          print(f"**🔨 run · {len(rs)} models · {fmt(env('T_DBT_RUN', '0'))}**\n")
          print("| Status | Count |")
          print("| --- | ---: |")
          print(f"| ✅ Success | **{ok}** |")
          print(f"| ❌ Error | **{err}** |")
          print(f"| ⏭️ Skipped | **{skip}** |")
          if rslow:
              print("\n**🐢 Slowest**\n")
              for s in rslow:
                  print(f"- `{s['unique_id'].split('.')[-1]}` {s.get('execution_time', 0):.1f}s")
          print('\n</td><td valign="top">\n')
          # test
          print(f"**✅ test · {ttotal} tests · {fmt(env('T_DBT_TEST', '0'))}**\n")
          print("| Result | Count |")
          print("| --- | ---: |")
          print(f"| ✅ Pass | **{tp}** |")
          print(f"| ❌ Fail | **{tf}** |")
          print(f"| ⚠️ Warn | **{tw}** |")
          print(f"| 💥 Error | **{te}** |")
          print('\n</td><td valign="top">\n')
          # docs
          print(f"**📚 docs · {fmt(env('T_DBT_DOCS', '0'))}**\n")
          print("| Resource | Count |")
          print("| --- | ---: |")
          for k in ('model', 'test', 'seed', 'snapshot', 'operation'):
              if by_type.get(k):
                  print(f"| {icons[k]} {k.title()}s | **{by_type[k]}** |")
          print(f"| 🔌 Sources | **{n_sources}** |")
          print(f"| 🧙 Macros | **{n_macros}** |")
          if page_url:
              print(f"\n🔗 [Live docs]({page_url})")
          print('\n</td></tr></table>')
          print('\n</td></tr>')
          print("</table>\n")

          # ===== Mermaid below =====
          print("## 🛤️ Pipeline\n")
          print("```mermaid")
          print("flowchart LR")
          print("  A[🏗️ Lakehouse] --> B[🔨 dbt run]")
          print("  B --> C[✅ dbt test]")
          print("  C --> D[📚 dbt docs]")
          print("  D --> E[🚀 Deploy Fabric]")
          print("  E --> F[🌐 Publish docs]")
          print("```")
          print()
          print("---")
          print(f'<sub>Pipeline run by <b>@{actor}</b> · commit <a href="{server}/{repo}/commit/{env("GITHUB_SHA")}"><code>{sha}</code></a> · <a href="{server}/{repo}/actions/runs/{run_id}">view run</a></sub>')
          PY

  publish:
    name: 🌐 Publish docs to Pages
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: 📝 Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🌐 Docs Published

          ![status](https://img.shields.io/badge/pages-live-brightgreen?style=for-the-badge&logo=githubpages)

          🔗 **Live site:** ${{ steps.publish.outputs.page_url }}
          EOF
